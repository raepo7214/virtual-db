<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>버튜버 등록/대량 등록</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; max-width: 1400px; margin: 40px auto; padding: 0 20px; background-color: #f8f9fa; }
        h1, h2 { color: #333; }
        .section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 30px; }
        
        .table-responsive { overflow-x: auto; margin-bottom: 15px; border: 1px solid #dee2e6; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 1600px; }
        th, td { border: 1px solid #dee2e6; padding: 8px; text-align: center; }
        th { background-color: #f1f3f5; font-size: 13px; white-space: nowrap; }
        td input, td select { width: 95%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        
        textarea { width: 100%; height: 180px; padding: 12px; box-sizing: border-box; font-family: monospace; border: 1px solid #ccc; border-radius: 6px; }
        .btn { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .btn-add { background: #17a2b8; margin-bottom: 15px; }
        .btn-secondary { background: #6c757d; text-decoration: none; display: inline-block; padding: 8px 16px; border-radius: 6px; color: white; margin-bottom: 20px; }
        .info { background: #e7f5ff; border-left: 4px solid #339af0; padding: 12px; margin-bottom: 15px; font-size: 13px; color: #1864ab; }
    </style>
</head>
<body>
    <a href="/" class="btn-secondary">← 메인으로 돌아가기</a>
    <h1>버튜버 데이터 등록 관리</h1>

    <!-- 1. 표 형식 입력 -->
    <div class="section">
        <h2>1. 표 형식 개별 입력 (드롭다운 & 행 추가 기능)</h2>
        <form action="/admin/bulk" method="post">
            <div class="table-responsive">
                <table id="input-table">
                    <thead>
                        <tr>
                            <th style="width: 120px;">이름 *</th>
                            <th style="width: 110px;">영문이름</th>
                            <th style="width: 110px;">플랫폼</th>
                            <th style="width: 100px;">상태</th>
                            <th style="width: 120px;">소속팀/사</th>
                            <th style="width: 90px;">성별</th>
                            <th style="width: 90px;">생일</th>
                            <th style="width: 80px;">나이</th>
                            <th style="width: 110px;">데뷔일</th>
                            <th style="width: 100px;">종족</th>
                            <th style="width: 110px;">팬네임</th>
                            <th style="width: 90px;">오시마크</th>
                            <th>주 플랫폼 링크</th>
                            <th>유튜브 링크</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- 기본 3개 행 생성 -->
                        <script>
                            function createRowHtml() {
                                return `
                                <tr>
                                    <td><input type="text" name="name[]" placeholder="이름"></td>
                                    <td><input type="text" name="name_en[]" placeholder="English"></td>
                                    <td>
                                        <select name="platform[]">
                                            <option value="치지직">치지직</option>
                                            <option value="SOOP">SOOP</option>
                                            <option value="유튜브">유튜브</option>
                                            <option value="트위치">트위치</option>
                                            <option value="기타">기타</option>
                                        </select>
                                    </td>
                                    <td>
                                        <select name="status[]">
                                            <option value="활동중">활동중</option>
                                            <option value="휴방">휴방</option>
                                            <option value="졸업">졸업</option>
                                        </select>
                                    </td>
                                    <td><input type="text" name="agency[]" placeholder="소속"></td>
                                    <td>
                                        <select name="gender[]">
                                            <option value="여성">여성</option>
                                            <option value="남성">남성</option>
                                            <option value="기타">기타</option>
                                        </select>
                                    </td>
                                    <td><input type="text" name="birthday[]" placeholder="MM-DD"></td>
                                    <td><input type="text" name="age[]" placeholder="나이"></td>
                                    <td><input type="text" name="debut_date[]" placeholder="YYYY-MM-DD"></td>
                                    <td><input type="text" name="species[]" placeholder="종족"></td>
                                    <td><input type="text" name="fan_name[]" placeholder="팬네임"></td>
                                    <td><input type="text" name="oshi_mark[]" placeholder="오시마크"></td>
                                    <td><input type="text" name="main_platform_url[]" placeholder="https://..."></td>
                                    <td><input type="text" name="youtube_url[]" placeholder="https://..."></td>
                                </tr>`;
                            }
                        </script>
                    </tbody>
                </table>
            </div>
            
            <button type="button" class="btn btn-add" onclick="addRow()">+ 입력 칸 더 늘리기 (행 추가)</button><br>
            <button type="submit" class="btn">표 데이터 전체 저장</button>
        </form>
    </div>

    <!-- 2. 구글 시트 텍스트 대량 입력 -->
    <div class="section">
        <h2>2. 구글 시트 텍스트 대량 붙여넣기</h2>
        <div class="info">
            <strong>입력 순서 (탭 구분):</strong><br>
            <code>이름 | 영문이름 | 플랫폼 | 상태 | 소속팀/사 | 성별 | 생일 | 나이 | 데뷔일 | 종족 | 팬네임 | 오시마크 | 주 플랫폼 링크 | 유튜브 링크</code>
        </div>
        <form action="/admin/bulk" method="post">
            <textarea name="bulk_data" placeholder="구글 시트에서 전체 범위를 복사(Ctrl+C)해서 그대로 붙여넣으세요..."></textarea><br><br>
            <button type="submit" class="btn">대량 붙여넣기 저장</button>
        </form>
    </div>

    <script>
        function addRow() {
            document.getElementById('table-body').insertAdjacentHTML('beforeend', createRowHtml());
        }
        // 초기 3개 행 자동 생성
        for(let i=0; i<3; i++) { addRow(); }
    </script>
</body>
</html>
