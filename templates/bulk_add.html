<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>버튜버 대량 등록</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; height: 250px; padding: 10px; font-family: monospace; box-sizing: border-box; }
        .btn { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; }
        .info { background: #e9ecef; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>버튜버 대량 등록</h1>
    <p><a href="/">← 메인으로 돌아가기</a></p>

    <div class="info">
        <strong>입력 형식 안내:</strong><br>
        한 줄에 하나씩 <code>이름, 플랫폼, 채널URL</code> 형태로 작성해주세요. (초성은 자동 추출됩니다)<br><br>
        <em>예시:</em><br>
        강지, 치지직, https://chzzk.naver.com/...<br>
        고세구, SOOP, https://soop.com/...<br>
        나나문, 유튜브, https://youtube.com/...
    </div>

    <form method="post">
        <textarea name="bulk_data" placeholder="데이터를 붙여넣으세요..."></textarea><br><br>
        <button type="submit" class="btn">대량 추가하기</button>
    </form>
</body>
</html>
